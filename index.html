<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ferramenta de Lances - O Leilão</title>
  <style>
    :root {
      --bg-dark: #0a0a0c;
      --card-bg: #121216;
      --border-color: #2a2a35;
      --accent-pink: #ff0055;
      --accent-hover: #ff3377;
      --text-main: #e1e1e6;
      --text-muted: #a0a0b0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .auction-tool-container {
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 25px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }

    .tool-header {
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 15px;
      margin-bottom: 25px;
      text-align: center;
    }

    .tool-header h2 {
      color: #fff;
      font-size: 1.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .tool-header p {
      color: var(--accent-pink);
      font-size: 0.85rem;
      letter-spacing: 1px;
      margin-top: 5px;
      text-transform: uppercase;
      font-weight: bold;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px;
      background: #08080a;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.3s;
    }

    input:focus {
      border-color: var(--accent-pink);
    }

    .row {
      display: flex;
      gap: 15px;
    }

    .col {
      flex: 1;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent-pink), #990033);
      border: 1px solid var(--accent-hover);
      color: #fff;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.3s;
      margin-top: 10px;
    }

    .btn-submit:hover {
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.6);
      transform: translateY(-1px);
    }

    .output-box {
      margin-top: 25px;
      background: #08080a;
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--accent-pink);
      padding: 15px;
      border-radius: 4px;
    }

    .output-box h4 {
      color: #fff;
      margin-bottom: 10px;
      font-size: 0.85rem;
      text-transform: uppercase;
    }

    textarea.code-result {
      width: 100%;
      height: 120px;
      font-family: monospace;
      font-size: 0.85rem;
      color: #7dd3fc;
      background: #08080a;
      border: 1px solid var(--border-color);
      padding: 10px;
      resize: none;
      margin-bottom: 10px;
      border-radius: 4px;
    }

    .btn-copy {
      background: #22222e;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: bold;
      transition: background 0.3s;
    }

    .btn-copy:hover {
      background: #333345;
    }
  </style>
</head>
<body>

<div class="auction-tool-container">
  <div class="tool-header">
    <h2>O Leilão</h2>
    <p>Formulário de Lances</p>
  </div>

  <div class="row">
    <div class="col form-group">
      <label>Nome do Personagem</label>
      <input type="text" id="p-name" placeholder="Ex: Jhon Golden Age">
    </div>
    <div class="col form-group">
      <label>Item Desejado</label>
      <input type="text" id="p-item" placeholder="Ex: Feijão Tropeiro">
    </div>
  </div>

  <div class="row">
    <div class="col form-group">
      <label>Valor do Lance (Ienes)</label>
      <input type="number" id="p-bid" placeholder="Ex: 500000">
    </div>
    <div class="col form-group">
      <label>Link do Banco</label>
      <input type="url" id="p-link" placeholder="URL do tópico">
    </div>
  </div>

  <button class="btn-submit" onclick="generateBidBBCode()">Gerar Código de Lance</button>

  <div class="output-box" id="player-output" style="display:none;">
    <h4>Código para o Fórum:</h4>
    <textarea id="p-code" class="code-result" readonly></textarea>
    <button class="btn-copy" onclick="copyCode()">📋 Copiar BBCode</button>
  </div>
</div>

<script>
  function generateBidBBCode() {
    const name = document.getElementById('p-name').value.trim() || 'Personagem';
    const item = document.getElementById('p-item').value.trim() || 'Item em Leilão';
    const bid = Number(document.getElementById('p-bid').value || 0).toLocaleString('pt-BR');
    const link = document.getElementById('p-link').value.trim() || '#';

    const bbcode = `[b]Personagem:[/b] ${name}
[b]Item Desejado:[/b] ${item}
[b]Valor do Lance:[/b] ¥ ${bid}
[b]Link do Banco/Ficha:[/b] ${link}`;

    document.getElementById('p-code').value = bbcode;
    document.getElementById('player-output').style.display = 'block';
  }

  function copyCode() {
    const codeArea = document.getElementById('p-code');
    codeArea.select();
    document.execCommand('copy');
    alert('Código copiado!');
  }
</script>

</body>
</html>
