<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ferramenta de Lances - O Leilão</title>
  <style>
    :root {
      --bg-dark: #0a0a0c;
      --card-bg: #121216;
      --border-color: #2a2a35;
      --accent-pink: #ff0055;
      --accent-hover: #ff3377;
      --text-main: #e1e1e6;
      --text-muted: #a0a0b0;
      --gold: #ffcc00;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .auction-tool-container {
      width: 100%;
      max-width: 750px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 25px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }

    .tool-header {
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 15px;
      margin-bottom: 25px;
      text-align: center;
    }

    .tool-header h2 {
      color: #fff;
      font-size: 1.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .tool-header p {
      color: var(--accent-pink);
      font-size: 0.85rem;
      letter-spacing: 1px;
      margin-top: 5px;
    }

    .nav-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      background: #181820;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      text-transform: uppercase;
      font-size: 0.85rem;
      transition: all 0.3s;
    }

    .tab-btn.active {
      background: var(--accent-pink);
      color: #fff;
      border-color: var(--accent-pink);
      box-shadow: 0 0 10px rgba(255, 0, 85, 0.4);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      background: #08080a;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.3s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent-pink);
    }

    .row {
      display: flex;
      gap: 15px;
    }

    .col {
      flex: 1;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent-pink), #990033);
      border: 1px solid var(--accent-hover);
      color: #fff;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.3s;
      margin-top: 10px;
    }

    .btn-submit:hover {
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.6);
      transform: translateY(-1px);
    }

    .output-box {
      margin-top: 25px;
      background: #08080a;
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--accent-pink);
      padding: 15px;
      border-radius: 4px;
    }

    .output-box h4 {
      color: #fff;
      margin-bottom: 10px;
      font-size: 0.85rem;
      text-transform: uppercase;
    }

    textarea.code-result {
      height: 110px;
      font-family: monospace;
      font-size: 0.85rem;
      color: #7dd3fc;
      resize: none;
      margin-bottom: 10px;
    }

    .btn-copy {
      background: #22222e;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: bold;
      transition: background 0.3s;
    }

    .btn-copy:hover {
      background: #333345;
    }

    .dice-result {
      background: #08080a;
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--gold);
      padding: 15px;
      border-radius: 4px;
      margin-top: 20px;
    }

    .dice-result p {
      margin-bottom: 8px;
      font-size: 0.95rem;
    }

    .highlight {
      color: var(--accent-pink);
      font-weight: bold;
    }

    .highlight-gold {
      color: var(--gold);
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="auction-tool-container">
  <div class="tool-header">
    <h2>O Leilão — Central de Lances</h2>
    <p>Gerador de Postagem & Calculadora de Concorrência NPC</p>
  </div>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('player-tab', this)">1. Gerar Lance (Jogador)</button>
    <button class="tab-btn" onclick="switchTab('npc-tab', this)">2. Disputa NPC (Ganância)</button>
  </div>

  <!-- ABA 1: FORMULÁRIO DO JOGADOR -->
  <div id="player-tab" class="tab-content active">
    <div class="row">
      <div class="col form-group">
        <label>Tipo de Item</label>
        <select id="p-type" onchange="updateMinBid()">
          <option value="comum">Item Comum (Mín: ¥ 50.000)</option>
          <option value="destaque">Item Destaque (Mín: ¥ 1.000.000)</option>
        </select>
      </div>
      <div class="col form-group">
        <label>Nome / Nº do Item</label>
        <input type="text" id="p-item" placeholder="Ex: Item #02 - Relíquia Obscura">
      </div>
    </div>

    <div class="row">
      <div class="col form-group">
        <label>Valor do Lance (Ienes)</label>
        <input type="number" id="p-bid" placeholder="50000" min="50000">
      </div>
      <div class="col form-group">
        <label>Origem dos Recursos</label>
        <select id="p-source">
          <option value="Saldo Próprio">Saldo Próprio</option>
          <option value="Linha de Crédito da Aranha">Linha de Crédito da Aranha</option>
          <option value="Misto (Saldo + Crédito)">Misto (Saldo + Crédito)</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>Link do Banco / Comprovação</label>
      <input type="url" id="p-link" placeholder="https://goldenagereps.forumeiros.com/t123-banco...">
    </div>

    <button class="btn-submit" onclick="generateBidBBCode()">Gerar Template de Lance</button>

    <div class="output-box" id="player-output" style="display:none;">
      <h4>Código para Postagem no Fórum:</h4>
      <textarea id="p-code" class="code-result" readonly></textarea>
      <button class="btn-copy" onclick="copyCode()">📋 Copiar BBCode</button>
    </div>
  </div>

  <!-- ABA 2: SIMULADOR DE NPC (GANÂNCIA E VALOR) -->
  <div id="npc-tab" class="tab-content">
    <div class="row">
      <div class="col form-group">
        <label>Raridade do Item</label>
        <select id="npc-rarity">
          <option value="comum">Comum (CD 10)</option>
          <option value="destaque">Destaque (CD 5)</option>
        </select>
      </div>
      <div class="col form-group">
        <label>Lances Já Feitos por NPCs (Máx: 10)</label>
        <input type="number" id="npc-count" value="0" min="0" max="10">
      </div>
    </div>

    <div class="form-group">
      <label>Último Lance Registrado (¥)</label>
      <input type="number" id="npc-last-bid" placeholder="Ex: 150000">
    </div>

    <button class="btn-submit" onclick="rollNPCAction()">Calcular Reação dos NPCs</button>

    <div id="npc-output" class="dice-result" style="display:none;"></div>
  </div>
</div>

<script>
  function switchTab(tabId, btn) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    btn.classList.add('active');
  }

  function updateMinBid() {
    const type = document.getElementById('p-type').value;
    const bidInput = document.getElementById('p-bid');
    if (type === 'comum') {
      bidInput.min = 50000;
      if (!bidInput.value || Number(bidInput.value) < 50000) bidInput.value = 50000;
    } else {
      bidInput.min = 1000000;
      if (!bidInput.value || Number(bidInput.value) < 1000000) bidInput.value = 1000000;
    }
  }

  function generateBidBBCode() {
    const item = document.getElementById('p-item').value.trim() || 'Item em Leilão';
    const bid = Number(document.getElementById('p-bid').value || 0).toLocaleString('pt-BR');
    const source = document.getElementById('p-source').value;
    const link = document.getElementById('p-link').value.trim() || '#';

    const bbcode = `[b]Item Desejado:[/b] ${item}\n[b]Valor do Lance:[/b] ¥ ${bid}\n[b]Origem dos Recurso:[/b] ${source}\n[b]Link do Banco/Ficha:[/b] ${link}`;

    document.getElementById('p-code').value = bbcode;
    document.getElementById('player-output').style.display = 'block';
  }

  function copyCode() {
    const codeArea = document.getElementById('p-code');
    codeArea.select();
    document.execCommand('copy');
    alert('Template de lance copiado!');
  }

  function rollNPCAction() {
    const rarity = document.getElementById('npc-rarity').value;
    const count = parseInt(document.getElementById('npc-count').value) || 0;
    const lastBid = parseFloat(document.getElementById('npc-last-bid').value) || 0;
    const output = document.getElementById('npc-output');

    if (count >= 10) {
      output.innerHTML = `<p class="highlight">⚠️ Limite Alcancado:</p><p>Os NPCs já realizaram 10 lances neste item e encerraram as disputas.</p>`;
      output.style.display = 'block';
      return;
    }

    if (lastBid <= 0) {
      alert('Informe o valor do último lance antes de rolar.');
      return;
    }

    const cd = rarity === 'comum' ? 10 : 5;
    const d20 = Math.floor(Math.random() * 20) + 1;
    const success = d20 >= cd;

    let html = `<p><b>Dado de Ganância (1d20):</b> Rolou <span class="highlight-gold">${d20}</span> (CD: ${cd})</p>`;

    if (success) {
      const d4 = Math.floor(Math.random() * 4) + 1;
      const percentages = { 1: 0.10, 2: 0.20, 3: 0.30, 4: 0.50 };
      const percentText = { 1: '10%', 2: '20%', 3: '30%', 4: '50%' };
      
      const increase = lastBid * percentages[d4];
      const newBid = lastBid + increase;

      html += `<p class="highlight">⚡ UM NPC COBRIU O LANCE!</p>`;
      html += `<p><b>Dado de Valor (1d4):</b> Rolou <span class="highlight-gold">${d4}</span> (+${percentText[d4]})</p>`;
      html += `<p><b>Aumento Aplicado:</b> +¥ ${increase.toLocaleString('pt-BR')}</p>`;
      html += `<p><b>Novo Lance do NPC:</b> <span class="highlight-gold">¥ ${newBid.toLocaleString('pt-BR')}</span></p>`;
      html += `<p style="font-size: 0.8rem; color: #a0a0b0; margin-top: 10px;">Lances efetuados por NPCs neste item: ${count + 1}/10</p>`;
    } else {
      html += `<p style="color: #ff4444; margin-top: 5px;">❌ Nenhum NPC cobriu a oferta. O lance atual do jogador se mantém na liderança.</p>`;
    }

    output.innerHTML = html;
    output.style.display = 'block';
  }

  updateMinBid();
</script>

</body>
</html>
